<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nostr Notes</title>
<meta name="description" content="My posts on Nostr.">

<style>
/* ---- Fonts (matches the blog: Metropolis, served from nate.mecca1.net) ---- */
@font-face{font-family:'Metropolis';font-style:normal;font-weight:300;
  src:local("Metropolis Light"),local("Metropolis-Light"),
      url("https://nate.mecca1.net/fonts/Metropolis-Light.woff2") format("woff2"),
      url("https://nate.mecca1.net/fonts/Metropolis-Light.woff") format("woff");font-display:swap}
@font-face{font-family:'Metropolis';font-style:normal;font-weight:400;
  src:local("Metropolis Regular"),local("Metropolis-Regular"),
      url("https://nate.mecca1.net/fonts/Metropolis-Regular.woff2") format("woff2"),
      url("https://nate.mecca1.net/fonts/Metropolis-Regular.woff") format("woff");font-display:swap}
@font-face{font-family:'Metropolis';font-style:italic;font-weight:400;
  src:local("Metropolis Regular Italic"),local("Metropolis-RegularItalic"),
      url("https://nate.mecca1.net/fonts/Metropolis-RegularItalic.woff2") format("woff2"),
      url("https://nate.mecca1.net/fonts/Metropolis-RegularItalic.woff") format("woff");font-display:swap}
@font-face{font-family:'Metropolis';font-style:normal;font-weight:500;
  src:local("Metropolis Medium"),local("Metropolis-Medium"),
      url("https://nate.mecca1.net/fonts/Metropolis-Medium.woff2") format("woff2"),
      url("https://nate.mecca1.net/fonts/Metropolis-Medium.woff") format("woff");font-display:swap}
@font-face{font-family:'Metropolis';font-style:normal;font-weight:700;
  src:local("Metropolis Bold"),local("Metropolis-Bold"),
      url("https://nate.mecca1.net/fonts/Metropolis-Bold.woff2") format("woff2"),
      url("https://nate.mecca1.net/fonts/Metropolis-Bold.woff") format("woff");font-display:swap}

/* ---- Theme tokens (lifted from the blog's stylesheet) ---- */
:root{
  --light:#fff;
  --dark:#000;
  --bg:#002538;
  --haze:#f2f2f2;
  --text:#575757;
  --header-text:#020202;
  --theme:#0077b8;
  --theme-dark:#003552;
  --font:Metropolis,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --translucent:rgba(0,0,0,0.05);
  --translucent-light:rgba(255,255,255,0.05);
  --shadow:rgba(0,0,0,0.12);
  --page-bg:var(--haze);
  --post-bg:var(--light);
  --footer-bg:var(--haze);
  --muted:#7b7b7b;
  --hairline:#dedede;
  --pill-bg:rgba(0,119,184,0.15);
  --pill-bg-hover:rgba(0,119,184,0.25);
  --pill-text:var(--theme);
  --pill-active-hover:var(--theme-dark);
  --maxWidth:1440px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="lit"]){
    --light:hsla(0,0%,100%,0.87);
    --text:var(--light);
    --header-text:var(--light);
    --page-bg:var(--bg);
    --post-bg:var(--translucent-light);
    --footer-bg:var(--bg);
    --muted:#a9bcc7;
    --hairline:rgba(255,255,255,0.12);
    --pill-bg:rgba(255,255,255,0.09);
    --pill-bg-hover:rgba(255,255,255,0.16);
    --pill-text:#7ec6ea;
    --pill-active-hover:#0d8ed6;
  }
}
:root[data-mode="dim"]{
    --light:hsla(0,0%,100%,0.87);
    --text:var(--light);
    --header-text:var(--light);
    --page-bg:var(--bg);
    --post-bg:var(--translucent-light);
    --footer-bg:var(--bg);
    --muted:#a9bcc7;
    --hairline:rgba(255,255,255,0.12);
    --pill-bg:rgba(255,255,255,0.09);
    --pill-bg-hover:rgba(255,255,255,0.16);
    --pill-text:#7ec6ea;
    --pill-active-hover:#0d8ed6;
}

/* ---- Base ---- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem;-webkit-text-size-adjust:100%;font-size:100%}
body{
  font-family:var(--font);
  background:var(--page-bg);
  color:var(--text);
  font-size:1.1rem;
  line-height:1.5;
  max-width:1920px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4{font-family:inherit;font-weight:300;padding:5px 0;margin:15px 0;color:var(--header-text);line-height:1.35}
h1{font-size:200%}
h2{font-size:170%}
h3{font-size:150%}
p{margin:0 0 1rem}
hr{border:none;height:1px;background:var(--hairline);margin:2rem 0}

/* ---- Top bar ---- */
.nav_header{
  background-color:#002538;
  padding:0 1.5rem;
  position:fixed;
  top:0;left:0;
  width:100%;
  z-index:99;
}
.nav{
  color:#fafafa;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  max-width:var(--maxWidth);
  margin:0 auto;
  min-height:3rem;
}
.nav_item{
  padding:0.5rem 1rem;
  display:inline-flex;
  align-items:center;
  border-radius:0.25rem;
  transition:background-color .3s ease-out;
}
.nav_item:hover,.nav_item:focus{background-color:rgba(255,255,255,0.05)}

/* ---- Light/dark switch (same control as the blog) ---- */
.color_mode{display:inline-flex;align-items:center;margin-left:0.5rem}
.color_choice{
  width:3rem;
  height:1.5rem;
  margin:0;
  border-radius:1rem;
  background-color:rgba(255,255,255,0.05);
  border:none;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:0 0.25rem 1rem rgba(0,0,0,0.15);
}
.color_choice::after{
  content:"";
  position:absolute;
  top:0.1rem;
  left:0.1rem;
  width:1.3rem;
  height:1.3rem;
  background-image:url("https://nate.mecca1.net/images/sun.svg");
  background-position:center;
  background-size:cover;
  border-radius:50%;
  z-index:2;
  transition:transform 0.3s cubic-bezier(.19,1,.22,1);
}
.color_choice:checked::after{
  background-image:url("https://nate.mecca1.net/images/night-moon.jpg");
  transform:translateX(1.4rem);
}
.color_choice:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---- Layout ---- */
.content{
  padding:5rem 1.5rem 1.5rem;
  max-width:var(--maxWidth);
  margin:0 auto;
  width:100%;
}
@media screen and (min-width:1441px){.content{padding-left:0;padding-right:0}}
.grid-inverse{display:grid;grid-template-columns:1fr;grid-column-gap:4rem}
@media screen and (min-width:900px){.grid-inverse{grid-template-columns:70% 1fr}}

.page_header{margin-bottom:2rem}
.page_header h1{margin-top:0}
.pale{color:var(--muted)}

/* ---- Note cards (same shape as the blog's .post_item / .excerpt) ---- */
.notes{list-style:none;margin:0;padding:0}
.note_item{
  margin-bottom:3rem;
  border-radius:0.5rem;
  background:var(--post-bg);
  box-shadow:0 0.25rem 1rem var(--shadow);
  overflow:hidden;
}
.note_header{padding:1rem 1rem 0}
.note_title{margin:0 0 0.5rem;padding:0;font-size:130%}
.note_title a:hover{color:var(--theme)}
.note_body{padding:0.5rem 1rem 1rem;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.note_body a{color:var(--theme);text-decoration:underline}
.note_footer{padding:0 1rem 1.5rem}
.note_meta{display:flex;flex-flow:row wrap;align-items:center;gap:0.5rem;font-size:0.9rem;color:var(--muted)}
.note_date{white-space:nowrap}

blockquote{
  margin:1.5rem 0;
  padding:1rem 1.5rem;
  border-left:0.2rem solid var(--theme);
  background:var(--translucent);
  color:var(--muted);
}
@media (prefers-color-scheme: dark){:root:not([data-mode="lit"]) blockquote{background:var(--translucent-light);color:#dedede}}
:root[data-mode="dim"] blockquote{background:var(--translucent-light);color:#dedede}

code{font-family:'Monaco',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:85%;word-break:break-all}

/* ---- Buttons / pills (theme blue #0077b8) ---- */
.button{
  background-color:var(--theme);
  color:#fff;
  display:inline-flex;
  align-items:center;
  padding:0.5rem 1.5rem;
  text-transform:uppercase;
  border:1px solid var(--theme);
  border-radius:1.5rem;
  font-size:0.9rem;
  user-select:none;
  cursor:pointer;
}
.button:hover,.button:focus{background-color:var(--theme-dark);border-color:var(--theme-dark);color:#fff}
.button_translucent{
  background-color:var(--pill-bg);
  color:var(--pill-text);
  border:1px solid transparent;
  padding:0.15rem 0.75rem;
  font-size:0.8rem;
  text-transform:none;
}
.button_translucent:hover,.button_translucent:focus{background-color:var(--pill-bg-hover);color:var(--pill-text);border-color:transparent}

/* ---- Type selector ---- */
.type_selector{
  display:flex;
  flex-flow:row wrap;
  gap:0.5rem;
  margin:0 0 2rem;
}
.type_option{
  font-family:inherit;
  font-size:0.9rem;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  padding:0.5rem 1.25rem;
  border-radius:1.5rem;
  border:1px solid transparent;
  background-color:var(--pill-bg);
  color:var(--pill-text);
  cursor:pointer;
  user-select:none;
  transition:background-color .2s ease-out,color .2s ease-out;
}
.type_option:hover{background-color:var(--pill-bg-hover)}
.type_option:focus-visible{outline:2px solid var(--theme);outline-offset:2px}
.type_option[aria-selected="true"]{background-color:var(--theme);border-color:var(--theme);color:#fff}
.type_option[aria-selected="true"]:hover{background-color:var(--pill-active-hover);border-color:var(--pill-active-hover)}
.empty{
  padding:2rem 0;
  color:var(--muted);
  font-style:italic;
}

/* ---- Sidebar ---- */
.sidebar{align-self:start}
@media screen and (min-width:900px){.sidebar{position:sticky;top:5rem}}
.card{
  background:var(--post-bg);
  border-radius:0.5rem;
  padding:1.25rem;
  margin-bottom:2rem;
  box-shadow:0 0.25rem 1rem var(--shadow);
}
.card h3{margin-top:0}
.card dl{margin:0;font-size:0.95rem}
.card dt{color:var(--muted);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.04em;margin-top:0.75rem}
.card dd{margin:0.15rem 0 0;word-break:break-all}
.relays{list-style:none;margin:0.25rem 0 0;padding:0;font-size:0.95rem}
.relays li{padding:0.15rem 0;color:var(--muted)}

/* ---- Ebook cards ---- */
.card_layout{display:grid;grid-template-columns:9rem 1fr;gap:1.25rem;padding:1rem}
.card_layout_nocover{grid-template-columns:1fr}
@media screen and (max-width:520px){.card_layout{grid-template-columns:1fr;gap:0.5rem}}
.card_cover{display:block;align-self:start}
.card_cover img{
  display:block;
  width:100%;
  height:auto;
  border-radius:0.25rem;
  background:var(--pill-bg);
  box-shadow:0 0.25rem 0.75rem var(--shadow);
}
@media screen and (max-width:520px){.card_cover{max-width:9rem}}
.card_main .note_header{padding:0}
.card_main .note_body{padding:0.5rem 0 0}
.card_main .note_footer{padding:1rem 0 0;display:flex;flex-flow:row wrap;align-items:center;gap:0.75rem}
.note_body_secondary{font-size:0.95rem;color:var(--muted)}
.note_body a{color:var(--theme)}
.card_mirrors{font-size:0.8rem;color:var(--muted)}
.card_mirrors a{color:var(--pill-text);text-decoration:underline}
.card_tags{display:flex;flex-flow:row wrap;gap:0.35rem}

/* ---- Notes (shortform) ---- */
.note_text{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.note_text_clamped{
  display:-webkit-box;
  -webkit-line-clamp:8;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.note_hashtag{color:var(--pill-text)}
.note_ref{color:var(--theme);text-decoration:underline}
.note_media_wrap{margin-top:0.75rem;display:grid;gap:0.5rem}
.note_media_grid{grid-template-columns:repeat(auto-fit,minmax(12rem,1fr))}
.note_media_link{display:block}
.note_media{
  display:block;
  max-width:100%;
  height:auto;
  border-radius:0.5rem;
  background:var(--pill-bg);
}
/* A single image keeps its own shape, capped so tall photos stay scannable. */
.note_media_wrap:not(.note_media_grid) .note_media{max-height:34rem;width:auto}
/* Several images line up as an even grid, so cropping is the lesser evil. */
.note_media_grid .note_media{width:100%;aspect-ratio:4/3;object-fit:cover}
.note_footer{display:flex;flex-flow:row wrap;align-items:center;gap:0.75rem}
.note_item > .note_body:last-child{padding-bottom:1.5rem}
.reader_body_note .note_text{font-size:1.1rem;line-height:1.7}
.reader_body_note .note_media,.reader_body_note .note_media_grid .note_media{max-height:none;width:auto;aspect-ratio:auto;object-fit:contain}

/* ---- YouTube embeds (click-to-play facade) ---- */
.yt_embed{margin-top:0.75rem;max-width:min(100%,44rem)}
.yt_facade,.yt_frame{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  border:none;
  border-radius:0.5rem;
  background:#000;
}
.yt_facade{position:relative;padding:0;cursor:pointer;overflow:hidden}
.yt_facade img{width:100%;height:100%;object-fit:cover;display:block}
.yt_play{
  position:absolute;
  inset:0;
  margin:auto;
  width:4.25rem;
  height:3rem;
  border-radius:0.75rem;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s ease-out;
}
.yt_play::after{
  content:"";
  border-style:solid;
  border-width:0.55rem 0 0.55rem 0.95rem;
  border-color:transparent transparent transparent #fff;
  margin-left:0.15rem;
}
.yt_facade:hover .yt_play,.yt_facade:focus-visible .yt_play{background:#f00}
.yt_caption{font-size:0.85rem;margin-top:0.4rem}
.yt_caption a{color:var(--pill-text);text-decoration:underline}
.card_embeds{margin-top:0.5rem}
.reader_body .yt_embed{margin:1.5rem 0}

/* ---- Lightbox (full-screen images) ---- */
body.viewing{overflow:hidden}
.lightbox{
  position:fixed;
  inset:0;
  z-index:300;
  background:#000;   /* opaque: the viewer replaces the page, it does not tint it */
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
}
.lightbox[hidden]{display:none}
.lightbox_stage{margin:0;display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%}
.lightbox_img{
  max-width:100%;
  max-height:calc(100vh - 2rem);
  width:auto;
  height:auto;
  display:block;
  border-radius:0.25rem;
}
.lightbox_close,.lightbox_nav{
  position:absolute;
  z-index:310;
  padding:0;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,0.14);
  color:#fff;
  font-family:inherit;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(4px);
}
.lightbox_close:hover,.lightbox_nav:hover,
.lightbox_close:focus-visible,.lightbox_nav:focus-visible{background:var(--theme)}
.lightbox_close{top:1rem;right:1rem;width:2.75rem;height:2.75rem;font-size:1.5rem}
.lightbox_nav{top:50%;transform:translateY(-50%);width:3rem;height:3rem;font-size:2rem}
.lightbox_prev{left:1rem}
.lightbox_next{right:1rem}
.lightbox_nav[hidden]{display:none}
.lightbox_count{
  position:absolute;
  bottom:1.25rem;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,0.75);
  font-size:0.9rem;
  letter-spacing:0.03em;
}
.lightbox_count:empty{display:none}
@media screen and (max-width:520px){
  .lightbox_nav{width:2.5rem;height:2.5rem;font-size:1.6rem}
  .lightbox_prev{left:0.35rem}
  .lightbox_next{right:0.35rem}
}
.note_media_link{cursor:zoom-in}

/* ---- Reader overlay (long-form posts) ---- */
body.reading{overflow:hidden}
.reader{
  position:fixed;
  inset:0;
  z-index:200;
  background:var(--page-bg);
  display:flex;
  flex-direction:column;
}
.reader[hidden]{display:none}
.reader_scroll{
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:4.5rem 1.5rem 6rem;
  -webkit-overflow-scrolling:touch;
}
.reader_inner{max-width:42rem;margin:0 auto}
.reader_close{
  position:fixed;
  top:1rem;
  right:1rem;
  z-index:210;
  width:2.75rem;
  height:2.75rem;
  padding:0;
  border:none;
  border-radius:50%;
  background:var(--theme);
  color:#fff;
  font-family:inherit;
  font-size:1.5rem;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0.25rem 1rem var(--shadow);
}
.reader_close:hover,.reader_close:focus{background:var(--pill-active-hover)}
.reader_hero:not(:empty){margin-bottom:1.5rem}
.reader_hero img{display:block;width:100%;height:auto;border-radius:0.5rem}
.reader_title{margin:0 0 0.5rem;font-size:210%;line-height:1.25}
.reader_meta{display:flex;flex-flow:row wrap;gap:0.75rem;font-size:0.9rem;color:var(--muted);margin-bottom:2rem}
.reader_body{font-size:1.15rem;line-height:1.75;overflow-wrap:break-word}
/* Long urls and naddr strings must not push the reader sideways. */
.reader_body a,.reader_body code{overflow-wrap:anywhere}
.reader_body p{margin:0 0 1.4rem}
.reader_body h2{font-size:160%;margin:2.5rem 0 1rem}
.reader_body h3{font-size:135%;margin:2rem 0 0.75rem}
.reader_body h4,.reader_body h5,.reader_body h6{font-size:115%;margin:1.75rem 0 0.75rem}
.reader_body a{color:var(--theme);text-decoration:underline}
.reader_body .md_img{display:block;max-width:100%;height:auto;border-radius:0.5rem;margin:1.5rem auto}
.reader_body .md_list{margin:0 0 1.4rem;padding-left:1.5rem}
.reader_body .md_list li{margin-bottom:0.5rem}
.reader_body pre{
  background:#002538;
  color:#f2f2f2;
  padding:1rem 1.25rem;
  border-radius:0.5rem;
  overflow-x:auto;
  margin:0 0 1.4rem;
  font-size:0.9rem;
  line-height:1.5;
}
.reader_body pre code{display:block;word-break:normal;white-space:pre}
.reader_body code{
  font-family:'Monaco',ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--pill-bg);
  border-radius:0.25rem;
  padding:0.1rem 0.3rem;
}
.reader_body blockquote{margin:0 0 1.4rem}
.reader_footer{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--hairline)}
.card_cover_clickable{cursor:pointer}

/* ---- Bookmarks & highlights ---- */
.type_badge{
  display:inline-flex;
  align-items:center;
  padding:0.1rem 0.6rem;
  border-radius:1rem;
  background:var(--pill-bg);
  color:var(--pill-text);
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:0.04em;
  flex:none;
}
.bookmark_host{color:var(--pill-text);text-decoration:underline;overflow-wrap:anywhere}
/* The quote carries the card's text colour; only the unmarked run recedes. */
.highlight_quote{
  margin:0;
  color:var(--text);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.highlight_context{color:var(--muted)}
/* A highlighter stroke rather than a block of fill, so the text stays legible. */
.highlight_mark{
  background:transparent;
  color:inherit;
  font-weight:500;
  box-shadow:inset 0 -0.55em 0 var(--pill-bg);
}
.highlight_comment{margin-top:0.85rem;color:var(--muted);font-size:0.95rem;overflow-wrap:anywhere}
.highlight_comment a{color:var(--theme);text-decoration:underline}
.reader_body_note .highlight_quote{font-size:1.15rem;line-height:1.7}
.reader_body_note .highlight_comment{font-size:1rem;margin-top:1.5rem}

/* ---- Relay status ---- */
.relay_item{display:flex;align-items:center;gap:0.5rem}
.relay_dot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--muted);flex:none}
.relay_connecting{background:#e0a04a}
.relay_connected{background:#4caf72}
.relay_error{background:#d9534f}

/* ---- Status / placeholder ---- */
.status{
  border:1px dashed var(--hairline);
  border-radius:0.5rem;
  padding:1rem 1.25rem;
  margin-bottom:2rem;
  font-size:0.95rem;
  color:var(--muted);
}

/* ---- Footer ---- */
.footer{
  background:var(--footer-bg);
  margin-top:2rem;
  font-size:0.9rem;
  padding:1.5rem;
}
.footer_inner{max-width:var(--maxWidth);margin:0 auto;display:flex;flex-flow:row wrap;gap:0.5rem 1.5rem;justify-content:space-between;align-items:center}
.footer a:hover{color:var(--theme)}
</style>
<script>
// Runs before paint: restores the reader's saved light/dark choice.
// "lit" and "dim" match the attribute the blog uses.
(function () {
  try {
    var saved = localStorage.getItem('color-mode');
    if (saved === 'lit' || saved === 'dim') {
      document.documentElement.setAttribute('data-mode', saved);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="nav_header">
  <nav class="nav">
    <a href="/" class="nav_item" title="Back">&lt;-- Back</a>
    <div class="color_mode">
      <input type="checkbox" class="color_choice" id="mode" title="Toggle light/dark mode" aria-label="Toggle light and dark mode">
    </div>
  </nav>
</header>

<main>
  <div class="grid-inverse content">

    <div>
      <div class="page_header">
        <h1>Nate's Recent Posts</h1>
      </div>

      <!--
        Type selector. Each button maps to one note category; selecting one shows
        only that category. Shortform is the default.

        Client note: fetch ALL categories in the background on page load,
        independent of which one is selected, so switching is instant. The client
        sets data-state="loading|ready|empty|error" on the corresponding
        <ul class="notes"> as each fetch progresses.
      -->
      <div class="type_selector" role="tablist" aria-label="Post type">
        <button type="button" class="type_option" role="tab" id="tab_shortform"
                data-kind="shortform" aria-controls="notes_shortform" aria-selected="true">
          Shortform
        </button>
        <button type="button" class="type_option" role="tab" id="tab_longform"
                data-kind="longform" aria-controls="notes_longform" aria-selected="false">
          Longform
        </button>
        <button type="button" class="type_option" role="tab" id="tab_media"
                data-kind="media" aria-controls="notes_media" aria-selected="false">
          Media
        </button>
        <button type="button" class="type_option" role="tab" id="tab_ebooks"
                data-kind="ebooks" aria-controls="notes_ebooks" aria-selected="false">
          Ebooks
        </button>
        <button type="button" class="type_option" role="tab" id="tab_bookmarks"
                data-kind="bookmarks" aria-controls="notes_bookmarks" aria-selected="false">
          Bookmarks
        </button>
      </div>

      <div class="status" id="status">
        Loading&hellip;
      </div>

      <!-- One list per category; the client replaces the contents of each. -->
      <ul class="notes" id="notes_shortform" role="tabpanel" aria-labelledby="tab_shortform" data-state="loading">
        <li class="empty">Loading…</li>
      </ul>

      <ul class="notes" id="notes_longform" role="tabpanel" aria-labelledby="tab_longform" data-state="loading" hidden>
        <li class="empty">Loading…</li>
      </ul>

      <ul class="notes" id="notes_media" role="tabpanel" aria-labelledby="tab_media" data-state="loading" hidden>
        <li class="empty">Loading…</li>
      </ul>

      <ul class="notes" id="notes_ebooks" role="tabpanel" aria-labelledby="tab_ebooks" data-state="loading" hidden>
        <li class="empty">Loading…</li>
      </ul>

      <!-- Web bookmarks (NIP-B0) and highlights (kind 9802), one timeline. -->
      <ul class="notes" id="notes_bookmarks" role="tabpanel" aria-labelledby="tab_bookmarks" data-state="loading" hidden>
        <li class="empty">Loading…</li>
      </ul>

    </div>

    <aside class="sidebar">
      <div class="card">
        <h3>Profile</h3>
        <dl>
          <dt>npub</dt>
          <dd id="npub" class="pale">not configured</dd>
          <dt>NIP-05</dt>
          <dd id="nip05" class="pale">not configured</dd>
        </dl>
      </div>

      <div class="card">
        <h3>Relays</h3>
        <ul class="relays" id="relays">
          <li>not configured</li>
        </ul>
      </div>
    </aside>

  </div>
</main>

<!-- Full-screen image viewer for note media; driven by client.js. -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" hidden>
  <button type="button" class="lightbox_close" id="lightbox_close" aria-label="Close image" title="Close">&times;</button>
  <button type="button" class="lightbox_nav lightbox_prev" id="lightbox_prev" aria-label="Previous image" title="Previous">&#8249;</button>
  <figure class="lightbox_stage" id="lightbox_stage">
    <img class="lightbox_img" id="lightbox_img" alt="">
  </figure>
  <button type="button" class="lightbox_nav lightbox_next" id="lightbox_next" aria-label="Next image" title="Next">&#8250;</button>
  <div class="lightbox_count" id="lightbox_count"></div>
</div>

<!-- Full-screen reader for long-form posts; filled in by client.js. -->
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader_title" aria-hidden="true" hidden>
  <button type="button" class="reader_close" id="reader_close" aria-label="Close reader" title="Close">&times;</button>
  <div class="reader_scroll">
    <article class="reader_inner">
      <div class="reader_hero" id="reader_hero"></div>
      <h1 class="reader_title" id="reader_title"></h1>
      <div class="reader_meta" id="reader_meta"></div>
      <div class="reader_body" id="reader_body"></div>
      <div class="reader_footer" id="reader_footer"></div>
    </article>
  </div>
</div>

<footer class="footer">
  <div class="footer_inner">
    <span class="pale">Nostr notes</span>
    <a href="/">&lt;-- Back</a>
  </div>
</footer>

<script src="client.js" defer></script>

</body>
</html>
